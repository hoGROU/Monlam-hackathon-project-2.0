<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tibetan Research Assistant</title>
    <meta name="description" content="Upload Tibetan documents and understand them instantly using AI — OCR, translation, summaries, and Q&A." />
    <!--
      Apply the saved theme before React mounts, otherwise a light-mode user
      sees a flash of the dark UI on every page load.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tra-theme") || "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
